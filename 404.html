<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161512">
<title>Returning to MaxChess</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#161512;color:#f2f0e8;font:16px system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:440px}h1{color:#e8c765}a{color:#e8c765}
</style>
</head>
<body>
<main>
<h1>Returning to MaxChess…</h1>
<p>Your sign-in or game link is being sent back to the MaxChess website.</p>
<p><a id="home" href="/">Tap here if you are not redirected.</a></p>
</main>
<script>
(function(){
 const target=new URL("/",location.origin);
 target.search=location.search;
 target.hash=location.hash;
 document.getElementById("home").href=target.href;
 if(location.pathname!=="/"&&location.pathname!=="/index.html")location.replace(target.href);
})();
</script>
</body>
</html>
